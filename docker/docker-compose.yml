# ============================================================
# TipFusion AI Ultimate — Docker Compose
# ============================================================
# Runs: API server + PostgreSQL + Redis + Adminer (DB UI)
#
# Usage:
#   docker compose up -d
#   docker compose logs -f tipfusion
# ============================================================

version: "3.9"

services:

  # ── TipFusion AI Main Application ──────────────────────────
  tipfusion:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tipfusion_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://tipfusion:tipfusion_pass@postgres:5432/tipfusion
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ../.env
    volumes:
      - ../logs:/app/logs
      - tipfusion_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - tipfusion_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── PostgreSQL Database ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tipfusion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tipfusion
      POSTGRES_USER: tipfusion
      POSTGRES_PASSWORD: tipfusion_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tipfusion_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tipfusion"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tipfusion_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - tipfusion_net
    command: redis-server --save 60 1 --loglevel warning

  # ── Adminer (Database UI) ────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: tipfusion_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - tipfusion_net
    depends_on:
      - postgres

  # ── Grafana (Monitoring Dashboard) ──────────────────────────
  # Uncomment to enable monitoring
  # grafana:
  #   image: grafana/grafana:latest
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - tipfusion_net

volumes:
  postgres_data:
  redis_data:
  tipfusion_data:

networks:
  tipfusion_net:
    driver: bridge
